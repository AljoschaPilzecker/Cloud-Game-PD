<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Online Pong</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    canvas {
      background: #000;
      border: 2px solid #333;
      width: min(100%, 800px, calc((100vh - 160px) * 1.6));
      height: auto;
      touch-action: none;
    }
    #info { text-align: center; min-height: 1.5em; }
    #controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
    button {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #3a3a3a; }
    #link { color: #8cf; word-break: break-all; }
    .hint { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="info">Verbinde…</div>
  <div id="controls">
    <button id="private">Privates Spiel mit Freund</button>
    <span id="link"></span>
  </div>
  <div class="hint">Steuerung: W/S oder ↑/↓ · Am Handy: Finger aufs Spielfeld</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const linkEl = document.getElementById('link');

    let field = { W: 800, H: 500, PADDLE_W: 12, PADDLE_H: 80, PADDLE_MARGIN: 20, BALL: 12, WIN_SCORE: 7 };
    let mySide = null;
    let state = null;
    let connected = false;

    // --- Verbindung -------------------------------------------------------
    const room = new URLSearchParams(location.search).get('room');
    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
      (room ? '/?room=' + encodeURIComponent(room) : '/');
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => { connected = true; };
    ws.onclose = () => {
      connected = false;
      info.textContent = 'Verbindung getrennt – Seite neu laden, um weiterzuspielen.';
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'welcome') {
        mySide = msg.side;
        field = msg.field;
        if (msg.room) {
          linkEl.textContent = 'Link zum Teilen: ' + location.origin + '/?room=' + msg.room;
        }
      } else if (msg.type === 'state') {
        state = msg;
        updateInfo();
      } else if (msg.type === 'full') {
        info.textContent = 'Dieser Raum ist schon voll.';
      }
    };

    document.getElementById('private').onclick = () => {
      const code = Math.random().toString(36).slice(2, 8);
      location.href = '/?room=' + code;
    };

    // --- Steuerung --------------------------------------------------------
    let keyDir = 0;
    let touchY = null;
    let sentDir = 0;
    const pressed = new Set();

    function sendDir(dir) {
      if (dir !== sentDir && connected) {
        sentDir = dir;
        ws.send(JSON.stringify({ type: 'input', dir }));
      }
    }

    function updateKeyDir() {
      const up = pressed.has('ArrowUp') || pressed.has('w') || pressed.has('W');
      const down = pressed.has('ArrowDown') || pressed.has('s') || pressed.has('S');
      keyDir = up === down ? 0 : (up ? -1 : 1);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
      pressed.add(e.key);
      updateKeyDir();
    });
    window.addEventListener('keyup', (e) => {
      pressed.delete(e.key);
      updateKeyDir();
    });
    window.addEventListener('blur', () => { pressed.clear(); updateKeyDir(); });

    function setTouch(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      touchY = ((t.clientY - rect.top) / rect.height) * field.H;
    }
    canvas.addEventListener('touchstart', setTouch, { passive: false });
    canvas.addEventListener('touchmove', setTouch, { passive: false });
    canvas.addEventListener('touchend', () => { touchY = null; });
    canvas.addEventListener('touchcancel', () => { touchY = null; });

    function currentDir() {
      if (keyDir !== 0) return keyDir;
      if (touchY !== null && state && mySide !== null) {
        // Schläger folgt dem Finger
        const center = state.p[mySide] + field.PADDLE_H / 2;
        if (touchY < center - 8) return -1;
        if (touchY > center + 8) return 1;
      }
      return 0;
    }

    // --- Anzeige ----------------------------------------------------------
    function updateInfo() {
      if (!state) return;
      const sideName = mySide === 0 ? 'links' : 'rechts';
      if (state.st === 'waiting') {
        info.textContent = 'Warte auf einen zweiten Spieler…';
      } else if (state.st === 'over') {
        info.textContent = (state.w === mySide ? 'Du hast gewonnen! 🎉' : 'Du hast verloren.') +
          ' Neue Runde startet gleich…';
      } else {
        info.textContent = 'Du spielst ' + sideName + ' (hell). Erster bis ' + field.WIN_SCORE + ' Punkte gewinnt.';
      }
    }

    function draw() {
      const { W, H, PADDLE_W, PADDLE_H, PADDLE_MARGIN, BALL } = field;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      // Mittellinie
      ctx.fillStyle = '#333';
      for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 15);

      if (!state) return;

      // Punkte
      ctx.fillStyle = '#555';
      ctx.font = 'bold 64px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(state.s[0], W / 4, 80);
      ctx.fillText(state.s[1], (W * 3) / 4, 80);

      // Schläger (der eigene ist heller)
      const xs = [PADDLE_MARGIN, W - PADDLE_MARGIN - PADDLE_W];
      for (let i = 0; i < 2; i++) {
        if (state.st === 'waiting' && i !== mySide) continue;
        ctx.fillStyle = i === mySide ? '#fff' : '#777';
        ctx.fillRect(xs[i], state.p[i], PADDLE_W, PADDLE_H);
      }

      // Ball
      if (state.b && state.st !== 'over') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(state.b[0], state.b[1], BALL, BALL);
      }

      // Großer Text in der Mitte
      let text = '';
      if (state.st === 'waiting') text = 'Warte auf Gegner…';
      else if (state.st === 'over') text = state.w === mySide ? 'Gewonnen!' : 'Verloren!';
      if (text) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px system-ui, sans-serif';
        ctx.fillText(text, W / 2, H / 2 + 14);
      }
    }

    function loop() {
      sendDir(currentDir());
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
