<title>Pong Duell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: ein Bildschirm wie ein alter Bernstein-Monitor: Spielfeld oben, Statuszeile und Bedienung darunter */
  :root {
    --bg: #15100a;
    --panel: #20180f;
    --amber: #ffb547;
    --amber-dim: #7d5426;
    --line: #3b2b19;
    --text: #f2dcb8;
    --muted: #a98b67;
    --display: 'VT323', 'Courier New', monospace;
    --body: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    overflow-x: hidden;
  }
  .top {
    width: min(100%, 880px);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 40px;
    letter-spacing: 0.12em;
    color: var(--amber);
    line-height: 1;
    text-shadow: 0 0 12px rgba(255, 181, 71, 0.35);
  }
  #online {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  canvas {
    display: block;
    width: min(100%, 880px, calc((100dvh - 260px) * 1.6));
    min-width: 260px;
    max-width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(255, 181, 71, 0.06), inset 0 0 60px rgba(0, 0, 0, 0.6);
    touch-action: none;
    cursor: ns-resize;
  }
  #status {
    margin: 0;
    width: min(100%, 880px);
    min-height: 2.6em;
    text-align: center;
    line-height: 1.4;
    text-wrap: balance;
  }
  #status b { color: var(--amber); font-weight: 600; letter-spacing: 0.08em; }
  .controls {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  button, input {
    font: inherit;
    font-size: 14px;
    border-radius: 4px;
    border: 1px solid var(--amber-dim);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
  button.primary { background: var(--amber); color: var(--bg); border-color: var(--amber); font-weight: 600; }
  button.primary:hover:not(:disabled) { color: var(--bg); filter: brightness(1.08); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  form { display: flex; gap: 6px; }
  input {
    width: 8.5em;
    text-transform: lowercase;
    letter-spacing: 0.12em;
  }
  input::placeholder { color: var(--muted); letter-spacing: 0.04em; }
  .hint { margin: 0; color: var(--muted); font-size: 12px; text-align: center; }
  .hint kbd {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
    color: var(--text);
  }
</style>

<header class="top">
  <h1>PONG DUELL</h1>
  <span id="online">verbinde…</span>
</header>

<canvas id="field" width="800" height="500" aria-label="Pong-Spielfeld"></canvas>

<p id="status" role="status" aria-live="polite">Wähle unten, wie du spielen willst.</p>

<div class="controls">
  <button id="btnOnline" class="primary" type="button" disabled>Online-Gegner suchen</button>
  <button id="btnCpu" type="button">Gegen Computer</button>
  <button id="btnPrivate" type="button" disabled>Privates Spiel</button>
  <form id="joinForm">
    <input id="code" name="code" placeholder="Code" maxlength="8" autocomplete="off" aria-label="Spiel-Code" disabled>
    <button id="btnJoin" type="submit" disabled>Beitreten</button>
  </form>
  <button id="btnLeave" type="button" hidden>Spiel verlassen</button>
</div>

<p class="hint"><kbd>W</kbd>/<kbd>S</kbd> oder <kbd>↑</kbd>/<kbd>↓</kbd> · Maus oder Finger aufs Spielfeld · Wer zuerst 7 Punkte hat, gewinnt</p>

<script>
(() => {
  // ---- Spielregeln (Spieleinheiten, das Canvas skaliert) ----------------
  const W = 800, H = 500;
  const PW = 12, PH = 80, PM = 20, BALL = 12;
  const PSPEED = 7, AI_SPEED = 5.2, BSPEED = 6, BMAX = 14;
  const WIN = 7, SERVE = 60, OVER = 300;
  const TICK = 1000 / 60;

  const cvs = document.getElementById('field');
  const ctx = cvs.getContext('2d');
  const statusEl = document.getElementById('status');
  const onlineEl = document.getElementById('online');
  const btnOnline = document.getElementById('btnOnline');
  const btnCpu = document.getElementById('btnCpu');
  const btnPrivate = document.getElementById('btnPrivate');
  const btnJoin = document.getElementById('btnJoin');
  const btnLeave = document.getElementById('btnLeave');
  const codeInput = document.getElementById('code');
  const joinForm = document.getElementById('joinForm');

  const css = getComputedStyle(document.documentElement);
  const C = {
    bg: css.getPropertyValue('--bg').trim(),
    amber: css.getPropertyValue('--amber').trim(),
    dim: css.getPropertyValue('--amber-dim').trim(),
    line: css.getPropertyValue('--line').trim(),
    text: css.getPropertyValue('--text').trim(),
  };

  // ---- Spielphysik -------------------------------------------------------
  const aiErr = [0, 0];
  const randErr = () => { aiErr[0] = Math.random() * 70 - 35; aiErr[1] = Math.random() * 70 - 35; };

  function newGame(st) {
    return { bx: (W - BALL) / 2, by: (H - BALL) / 2, vx: 0, vy: 0, sp: BSPEED, s: [0, 0], st: st || 'serve', t: SERVE, w: -1 };
  }
  function serve(g, dir) {
    const a = (Math.random() - 0.5) * (Math.PI / 3);
    Object.assign(g, {
      bx: (W - BALL) / 2, by: (H - BALL) / 2, sp: BSPEED,
      vx: dir * BSPEED * Math.cos(a), vy: BSPEED * Math.sin(a),
      st: 'serve', t: SERVE,
    });
    randErr();
  }
  function restart(g) {
    g.s = [0, 0];
    g.w = -1;
    serve(g, Math.random() < 0.5 ? -1 : 1);
  }
  function hit(g, px, py) {
    return g.bx < px + PW && g.bx + BALL > px && g.by < py + PH && g.by + BALL > py;
  }
  function bounce(g, py, dir) {
    // Je weiter außen der Schläger trifft, desto steiler fliegt der Ball zurück
    const rel = Math.max(-1, Math.min(1, (g.by + BALL / 2 - (py + PH / 2)) / (PH / 2)));
    const a = rel * (Math.PI / 3);
    g.sp = Math.min(g.sp * 1.05, BMAX);
    g.vx = dir * g.sp * Math.cos(a);
    g.vy = g.sp * Math.sin(a);
    randErr();
  }
  function point(g, scorer) {
    g.s[scorer]++;
    if (g.s[scorer] >= WIN) {
      g.st = 'over';
      g.w = scorer;
      g.t = OVER;
    } else {
      serve(g, scorer === 0 ? 1 : -1);
    }
  }
  function step(g, pads) {
    if (g.st === 'wait') return;
    if (g.st === 'over') { if (--g.t <= 0) restart(g); return; }
    if (g.st === 'serve') { if (--g.t <= 0) g.st = 'play'; return; }
    g.bx += g.vx;
    g.by += g.vy;
    if (g.by < 0) { g.by = 0; g.vy = -g.vy; }
    else if (g.by + BALL > H) { g.by = H - BALL; g.vy = -g.vy; }
    const lx = PM, rx = W - PM - PW;
    if (g.vx < 0 && hit(g, lx, pads[0])) { g.bx = lx + PW; bounce(g, pads[0], 1); }
    else if (g.vx > 0 && hit(g, rx, pads[1])) { g.bx = rx - BALL; bounce(g, pads[1], -1); }
    if (g.bx + BALL < 0) point(g, 1);
    else if (g.bx > W) point(g, 0);
  }

  // ---- Zustand -----------------------------------------------------------
  let mode = 'demo';            // demo | cpu | online
  let g = newGame();
  restart(g);
  const pads = [(H - PH) / 2, (H - PH) / 2];
  const clampPad = (y) => Math.max(0, Math.min(H - PH, y));

  // ---- Eingabe -----------------------------------------------------------
  const keys = new Set();
  let pointerY = null;

  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement) return;
    if (['ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    keys.add(e.key.toLowerCase());
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());

  function setPointer(e) {
    const r = cvs.getBoundingClientRect();
    pointerY = ((e.clientY - r.top) / r.height) * H;
  }
  cvs.addEventListener('pointermove', setPointer);
  cvs.addEventListener('pointerdown', (e) => { setPointer(e); unlockAudio(); });

  function moveLocal(i) {
    const up = keys.has('arrowup') || keys.has('w');
    const down = keys.has('arrowdown') || keys.has('s');
    const dir = up === down ? 0 : up ? -1 : 1;
    if (dir !== 0) {
      pointerY = null;
      pads[i] = clampPad(pads[i] + dir * PSPEED);
    } else if (pointerY !== null) {
      const d = pointerY - PH / 2 - pads[i];
      pads[i] = clampPad(pads[i] + Math.max(-PSPEED * 1.5, Math.min(PSPEED * 1.5, d)));
    }
  }

  function ai(i) {
    const coming = i === 0 ? g.vx < 0 : g.vx > 0;
    const target = coming && g.st === 'play' ? g.by + BALL / 2 - PH / 2 + aiErr[i] : (H - PH) / 2;
    const d = target - pads[i];
    pads[i] = clampPad(pads[i] + Math.max(-AI_SPEED, Math.min(AI_SPEED, d)));
  }

  // ---- Ton (startet erst nach dem ersten Klick) --------------------------
  let audio = null;
  function unlockAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
  }
  function blip(freq, dur) {
    if (!audio || mode === 'demo') return;
    const o = audio.createOscillator();
    const v = audio.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    v.gain.setValueAtTime(0.05, audio.currentTime);
    v.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(v).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dur);
  }

  // ---- Online über den room-Baustein von claude.ai ----------------------
  let room = null;              // Lobby: alle, die die Seite gerade offen haben
  let roomReadyAt = 0;
  let net = null;               // { code, r, seat, auto, unsubs }
  let seeking = null;           // { code, since } solange wir in der Lobby nach Gegnern suchen
  let lobbyCount = 0;
  let sticky = false;           // eine Fehlermeldung bleibt stehen, bis jemand klickt
  const badCodes = new Set();   // Spiele, die beim Beitreten schon voll waren

  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const newCode = () => Math.random().toString(36).slice(2, 7).padEnd(5, '0');
  const validCode = (c) => typeof c === 'string' && /^[a-z0-9]{3,8}$/.test(c);
  const r1 = (n) => Math.round(n * 10) / 10;

  function myPeer(r) {
    const me = r.peers().find((p) => p.sameTab);
    return me ? me.peer : '';
  }
  function others() {
    return net ? net.r.peers().filter((p) => !p.sameTab) : [];
  }
  function seatHolder(seat) {
    return others().find((p) => p.presence && p.presence.seat === seat) || null;
  }
  function opponent() {
    if (!net || net.seat < 0) return null;
    return seatHolder(1 - net.seat);
  }

  function advertise(code) {
    if (!room) return;
    seeking = { code, since: Date.now() };
    room.presence({ seek: code, since: seeking.since }).catch(() => {});
  }
  function stopAdvertising() {
    if (!seeking || !room) { seeking = null; return; }
    seeking = null;
    room.presence({ seek: null, since: null }).catch(() => {});
  }
  function findSeeker() {
    if (!room) return null;
    return room.peers()
      .filter((p) => !p.sameTab && p.presence && validCode(p.presence.seek) && !badCodes.has(p.presence.seek) && typeof p.presence.since === 'number')
      .sort((a, b) => a.presence.since - b.presence.since || (a.peer < b.peer ? -1 : 1))[0] || null;
  }

  function sendPresence() {
    if (!net) return;
    const p = { seat: net.seat, y: Math.round(pads[Math.max(net.seat, 0)]) };
    if (net.seat === 0) {
      p.g = { x: r1(g.bx), y: r1(g.by), vx: r1(g.vx), vy: r1(g.vy), s: g.s.slice(), st: g.st, w: g.w };
    }
    net.r.presence(p).catch(() => {});
  }

  function onRoomPeers() {
    if (!net) return;
    const me = myPeer(net.r);
    // Zwei Leute auf demselben Platz: der mit dem kleineren Kürzel bleibt
    if (net.seat >= 0) {
      const rival = others().find((p) => p.presence && p.presence.seat === net.seat && p.peer < me);
      if (rival) {
        const free = [0, 1].find((s) => s !== net.seat && !seatHolder(s));
        net.seat = free === undefined ? -1 : free;
        sendPresence();
      }
    }
    // Gastgeber weg: der Gast übernimmt und wartet auf einen neuen Gegner
    if (net.seat === 1 && !seatHolder(0)) {
      net.seat = 0;
      g = newGame('wait');
      sendPresence();
    }
    // Zuschauer rücken nach, sobald ein Platz frei wird
    if (net.seat === -1) {
      const free = [0, 1].find((s) => !seatHolder(s));
      if (free !== undefined) {
        net.seat = free;
        if (free === 0) g = newGame('wait');
        sendPresence();
      }
    }
  }

  function leaveRoom() {
    stopAdvertising();
    if (!net) return;
    net.unsubs.forEach((u) => u());
    net.r.leave().catch(() => {});
    net = null;
  }

  async function enterRoom(code, creator, auto) {
    leaveRoom();
    setButtons(true);
    setStatus('Verbinde mit dem Spiel…');
    let r;
    try {
      r = await room.join('pong-' + code);
    } catch {
      setStatus('Das Spiel konnte nicht geöffnet werden. Versuch es gleich noch einmal.');
      toDemo();
      return;
    }
    const mine = { code, r, seat: creator ? 0 : -1, auto, unsubs: [] };
    net = mine;
    mode = 'online';
    pads[0] = pads[1] = (H - PH) / 2;
    if (!creator) {
      await wait(1200); // kurz warten, bis alle im Raum gemeldet sind
      if (net !== mine) return;
      const taken = new Set(others().map((p) => p.presence && p.presence.seat));
      mine.seat = !taken.has(0) ? 0 : !taken.has(1) ? 1 : -1;
      if (auto && mine.seat === -1) { badCodes.add(code); startSearch(); return; }
    }
    g = newGame('wait');
    sendPresence();
    mine.unsubs.push(r.onPeers(onRoomPeers, () => {
      if (net !== mine) return;
      setStatus('Die Verbindung zum Spiel ist abgerissen. Starte ein neues Spiel.');
      net = null;
      toDemo(true);
    }));
  }

  async function startSearch() {
    if (!room) return;
    leaveRoom();
    setButtons(true);
    mode = 'online';
    setStatus('Suche Gegner…');
    const settle = 1500 - (Date.now() - roomReadyAt);
    if (settle > 0) await wait(settle);
    const s = findSeeker();
    if (s) {
      await enterRoom(s.presence.seek, false, true);
    } else {
      const code = newCode();
      await enterRoom(code, true, true);
      if (net && net.code === code) advertise(code);
    }
  }

  function onLobbyPeers() {
    lobbyCount = room ? room.peers().length : 0;
    onlineEl.textContent = lobbyCount === 1 ? 'nur du bist hier' : lobbyCount + ' Leute hier';
    // Zwei suchen gleichzeitig: der später Gekommene wechselt zum früheren Spiel
    if (net && net.auto && net.seat === 0 && seeking && !opponent()) {
      const s = findSeeker();
      if (s && s.presence.seek !== net.code &&
          (s.presence.since < seeking.since || (s.presence.since === seeking.since && s.peer < myPeer(room)))) {
        enterRoom(s.presence.seek, false, true);
      }
    }
  }

  function onlineTick() {
    if (!net) return;
    if (net.seat >= 0) moveLocal(net.seat);
    const opp = opponent();
    if (net.seat === 0) {
      if (opp) {
        if (seeking) stopAdvertising();
        if (g.st === 'wait') restart(g);
        const y = Number(opp.presence.y);
        if (Number.isFinite(y)) pads[1] = clampPad(y);
        step(g, pads);
      } else {
        if (g.st !== 'wait') g = newGame('wait');
        if (net.auto && !seeking) advertise(net.code);
      }
    } else {
      const host = seatHolder(0);
      const y = host ? Number(host.presence.y) : NaN;
      if (Number.isFinite(y)) pads[0] = clampPad(y);
      if (net.seat === -1) {
        const guest = seatHolder(1);
        const gy = guest ? Number(guest.presence.y) : NaN;
        if (Number.isFinite(gy)) pads[1] = clampPad(gy);
      }
    }
  }

  // Was gerade gezeichnet wird. Der Gast zeigt den Ball des Gastgebers und
  // rechnet ihn bis zum aktuellen Moment weiter, damit er flüssig läuft.
  function view() {
    if (mode !== 'online' || !net || net.seat === 0) {
      return { bx: g.bx, by: g.by, vx: g.vx, vy: g.vy, s: g.s, st: g.st, w: g.w };
    }
    const host = seatHolder(0);
    const hg = host && host.presence.g;
    if (!hg || typeof hg !== 'object' || !Array.isArray(hg.s)) {
      return { bx: 0, by: 0, vx: 0, vy: 0, s: [0, 0], st: 'wait', w: -1 };
    }
    const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    let bx = num(hg.x), by = num(hg.y);
    const vx = num(hg.vx), vy = num(hg.vy);
    const st = ['wait', 'serve', 'play', 'over'].includes(hg.st) ? hg.st : 'wait';
    if (st === 'play') {
      const k = Math.min(Date.now() - host.updatedAt, 120) / TICK;
      bx += vx * k;
      by += vy * k;
      if (by < 0) by = -by;
      if (by > H - BALL) by = 2 * (H - BALL) - by;
    }
    return { bx, by, vx, vy, s: [num(hg.s[0]), num(hg.s[1])], st, w: num(hg.w) };
  }

  // ---- Bedienung ---------------------------------------------------------
  let lastStatus = '';
  function setStatus(html) {
    if (html === lastStatus) return;
    lastStatus = html;
    statusEl.innerHTML = html;
  }

  function setButtons(inGame) {
    if (inGame) sticky = false;
    const online = !!room;
    btnOnline.disabled = !online || inGame;
    btnPrivate.disabled = !online || inGame;
    codeInput.disabled = !online || inGame;
    btnJoin.disabled = !online || inGame;
    btnCpu.disabled = inGame;
    btnLeave.hidden = !inGame;
  }

  function toDemo(keepStatus) {
    leaveRoom();
    mode = 'demo';
    g = newGame();
    restart(g);
    setButtons(false);
    sticky = !!keepStatus;
  }

  btnCpu.addEventListener('click', () => {
    unlockAudio();
    leaveRoom();
    mode = 'cpu';
    g = newGame();
    restart(g);
    setButtons(true);
  });
  btnOnline.addEventListener('click', () => { unlockAudio(); startSearch(); });
  btnPrivate.addEventListener('click', () => { unlockAudio(); enterRoom(newCode(), true, false); });
  joinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    unlockAudio();
    const code = codeInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!validCode(code)) {
      setStatus('Der Code besteht aus 3 bis 8 Buchstaben oder Ziffern. Prüf ihn bitte noch einmal.');
      return;
    }
    enterRoom(code, false, false);
  });
  btnLeave.addEventListener('click', () => toDemo());

  function statusText(v) {
    if (mode === 'demo') {
      if (sticky) return null;
      return room
        ? 'Wähle unten, wie du spielen willst. Online spielst du gegen alle, die diese Seite gerade offen haben.'
        : 'Gegen den Computer kannst du sofort spielen. Online-Spiele gehen nur, wenn du die Seite angemeldet auf claude.ai öffnest.';
    }
    const side = (s) => (s === 0 ? 'links' : 'rechts');
    if (mode === 'cpu') {
      if (v.st === 'over') return v.w === 0 ? '<b>Gewonnen!</b> Neue Runde startet gleich.' : 'Der Computer war schneller. Neue Runde startet gleich.';
      return 'Du spielst <b>links</b> gegen den Computer.';
    }
    if (!net) return lastStatus;
    if (net.seat === -1) return 'Das Spiel ist schon voll. Du schaust zu.';
    if (v.st === 'wait') {
      if (net.auto) return 'Suche Gegner… Sobald jemand anderes diese Seite öffnet und „Online-Gegner suchen“ drückt, geht es los.';
      return 'Dein Spiel-Code: <b>' + net.code + '</b> · Schick ihn deinem Freund. Er öffnet diese Seite, tippt den Code unten ein und drückt „Beitreten“.';
    }
    if (v.st === 'over') return v.w === net.seat ? '<b>Gewonnen!</b> Neue Runde startet gleich.' : 'Diesmal verloren. Neue Runde startet gleich.';
    return 'Du spielst <b>' + side(net.seat) + '</b> (heller Schläger). Viel Glück!';
  }

  // ---- Zeichnen ----------------------------------------------------------
  let prev = null;
  function sounds(v) {
    if (prev && v.st === 'play' && prev.st === 'play') {
      if (Math.sign(v.vx) !== Math.sign(prev.vx)) blip(440, 0.06);
      else if (Math.sign(v.vy) !== Math.sign(prev.vy)) blip(220, 0.04);
    }
    if (prev && (v.s[0] !== prev.s[0] || v.s[1] !== prev.s[1])) blip(110, 0.25);
    prev = { vx: v.vx, vy: v.vy, s: v.s.slice(), st: v.st };
  }

  function draw(v) {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = C.line;
    for (let y = 8; y < H; y += 28) ctx.fillRect(W / 2 - 2, y, 4, 14);

    ctx.fillStyle = C.dim;
    ctx.font = '96px VT323, "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(String(v.s[0]), W / 4, 18);
    ctx.fillText(String(v.s[1]), (W * 3) / 4, 18);

    const mySeat = mode === 'cpu' ? 0 : mode === 'online' && net ? net.seat : -1;
    const xs = [PM, W - PM - PW];
    ctx.shadowColor = C.amber;
    for (let i = 0; i < 2; i++) {
      if (v.st === 'wait' && i !== mySeat) continue;
      ctx.fillStyle = mySeat === -1 || i === mySeat ? C.amber : C.dim;
      ctx.shadowBlur = i === mySeat ? 14 : 0;
      ctx.fillRect(xs[i], pads[i], PW, PH);
    }
    if (v.st === 'serve' || v.st === 'play') {
      ctx.fillStyle = C.text;
      ctx.shadowBlur = 12;
      ctx.fillRect(v.bx, v.by, BALL, BALL);
    }
    ctx.shadowBlur = 0;

    let big = '';
    if (mode === 'demo') big = 'DEMO';
    else if (v.st === 'wait') big = 'WARTE AUF GEGNER';
    else if (v.st === 'over') big = mySeat === -1 ? (v.w === 0 ? 'LINKS GEWINNT' : 'RECHTS GEWINNT') : v.w === mySeat ? 'GEWONNEN!' : 'VERLOREN';
    if (big) {
      ctx.font = (mode === 'demo' ? '44px' : '64px') + ' VT323, "Courier New", monospace';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = mode === 'demo' ? C.dim : C.amber;
      ctx.fillText(big, W / 2, H / 2);
    }
  }

  // ---- Hauptschleife -----------------------------------------------------
  let acc = 0, last = performance.now(), sendTick = 0;
  function tick() {
    if (mode === 'demo') { ai(0); ai(1); step(g, pads); }
    else if (mode === 'cpu') { moveLocal(0); ai(1); step(g, pads); }
    else if (mode === 'online') {
      onlineTick();
      if (net && ++sendTick % 2 === 0) sendPresence(); // ~30 Updates pro Sekunde
    }
  }
  function frame(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= TICK) { acc -= TICK; tick(); }
    const v = view();
    sounds(v);
    draw(v);
    const text = statusText(v);
    if (text) setStatus(text);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Verbindung zu claude.ai herstellen --------------------------------
  const use = window.claude && typeof window.claude.use === 'function'
    ? window.claude.use('room')
    : Promise.resolve(null);
  use.then((r) => {
    if (!r) {
      onlineEl.textContent = 'offline';
      setButtons(mode !== 'demo');
      return;
    }
    room = r;
    roomReadyAt = Date.now();
    room.onPeers(onLobbyPeers, () => {
      room = null;
      onlineEl.textContent = 'offline';
      if (mode === 'online') { setStatus('Die Verbindung ist abgerissen. Lade die Seite neu, um online zu spielen.'); toDemo(true); }
      else setButtons(mode !== 'demo');
    });
    setButtons(mode !== 'demo');
  }).catch(() => { onlineEl.textContent = 'offline'; });
})();
</script>
